{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-pocketbase-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: pocketbase
    release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: {{ .Values.ingress.host | default (printf "pb-%s.aigentworkforce.com" .Release.Name) }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-pocketbase
                port:
                  number: 8080
{{- end }}
