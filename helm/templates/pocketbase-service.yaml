apiVersion: v1
kind: Service
metadata:
  labels:
    app: pocketbase
    release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ .Release.Name }}-pocketbase
  namespace: {{ .Release.Namespace | default "pocketbase" }}
spec:
  ports:
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    release: {{ .Release.Name }}
