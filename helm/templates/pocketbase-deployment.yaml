apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pocketbase
    release: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ .Release.Name }}-pocketbase
  namespace: {{ .Release.Namespace | default "pocketbase" }}
spec:
  replicas: 1
  selector:
    matchLabels:
      release: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pocketbase
        release: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - image: guestros/pocketbase:latest
          name: pocketbase
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /pb/pb_data
              name: pocketbase
      restartPolicy: Always
      volumes:
        - name: pocketbase
          hostPath:
            path: {{ printf "/mnt/hdd/pocketbase/%s" .Release.Name }}
            type: DirectoryOrCreate
  replicas: {{ .Values.replicaCount }}
